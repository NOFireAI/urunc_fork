name: CRI validation (critest)
on:
  # temporary trigger to verify the workflow on the feature branch;
  # drop before merging (dispatch works once the file is on main)
  push:
    branches: ["feat/critest"]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      go_version:
        type: string
        default: '1.26.4'
      runc_version:
        type: string
        default: '1.3.0'
      containerd_version:
        type: string
        default: '2.1.3'
      cni_version:
        type: string
        default: '1.7.1'
      critools_version:
        type: string
        default: 'v1.36.0'
    secrets:
      GIT_CLONE_PAT:
        required: false

  workflow_dispatch:
    inputs:
      go_version:
        type: string
        default: '1.26.4'
      runc_version:
        type: string
        default: '1.3.0'
      containerd_version:
        type: string
        default: '2.1.3'
      cni_version:
        type: string
        default: '1.7.1'
      critools_version:
        type: string
        default: 'v1.36.0'

permissions:
  contents: read

jobs:
  critest:
    name: critest validation
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
      fail-fast: false

    steps:
    - name: Validate inputs (prevent command injection)
      shell: bash
      env:
        GO_VERSION: ${{ inputs.go_version || '1.26.4' }}
        RUNC_VERSION: ${{ inputs.runc_version || '1.3.0' }}
        CONTAINERD_VERSION: ${{ inputs.containerd_version || '2.1.3' }}
        CNI_VERSION: ${{ inputs.cni_version || '1.7.1' }}
        CRITOOLS_VERSION: ${{ inputs.critools_version || 'v1.36.0' }}
      run: |
        for var in GO_VERSION RUNC_VERSION CONTAINERD_VERSION CNI_VERSION CRITOOLS_VERSION; do
          value="${!var}"
          if ! [[ "$value" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid format for $var: $value"
            exit 1
          fi
        done

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go_version || '1.26.4' }}
        cache: false

    - name: Install base dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget build-essential libseccomp-dev pkg-config bc make

    - name: Install runc
      env:
        RUNC_VERSION: ${{ inputs.runc_version || '1.3.0' }}
      run: |
        SAFE_RUNC="${RUNC_VERSION}"
        wget -q "https://github.com/opencontainers/runc/releases/download/v${SAFE_RUNC}/runc.$(dpkg --print-architecture)"
        sudo install -m 755 runc.$(dpkg --print-architecture) /usr/local/sbin/runc
        rm -f ./runc.$(dpkg --print-architecture)

    - name: Install containerd
      env:
        CONTAINERD_VERSION: ${{ inputs.containerd_version || '2.1.3' }}
      run: |
        SAFE_CONTAINERD="${CONTAINERD_VERSION}"
        wget -q "https://github.com/containerd/containerd/releases/download/v${SAFE_CONTAINERD}/containerd-${SAFE_CONTAINERD}-linux-$(dpkg --print-architecture).tar.gz"
        sudo tar Cxzf /usr/local "containerd-${SAFE_CONTAINERD}-linux-$(dpkg --print-architecture).tar.gz"
        rm -f "containerd-${SAFE_CONTAINERD}-linux-$(dpkg --print-architecture).tar.gz"
        wget -q "https://raw.githubusercontent.com/containerd/containerd/v${SAFE_CONTAINERD}/containerd.service"
        sudo rm -f /lib/systemd/system/containerd.service
        sudo mv containerd.service /lib/systemd/system/containerd.service
        sudo systemctl daemon-reload
        sudo systemctl enable --now containerd

    - name: Install CNI plugins
      env:
        CNI_VERSION: ${{ inputs.cni_version || '1.7.1' }}
      run: |
        SAFE_CNI="${CNI_VERSION}"
        wget -q "https://github.com/containernetworking/plugins/releases/download/v${SAFE_CNI}/cni-plugins-linux-$(dpkg --print-architecture)-v${SAFE_CNI}.tgz"
        sudo mkdir -p /opt/cni/bin
        sudo tar Cxzf /opt/cni/bin "cni-plugins-linux-$(dpkg --print-architecture)-v${SAFE_CNI}.tgz"
        rm -f "cni-plugins-linux-$(dpkg --print-architecture)-v${SAFE_CNI}.tgz"
        sudo mkdir -p /etc/cni/net.d
        sudo tee /etc/cni/net.d/10-critest-bridge.conflist > /dev/null <<'EOT'
        {
          "cniVersion": "1.0.0",
          "name": "critest-bridge",
          "plugins": [
            { "type": "bridge", "bridge": "cni0", "isGateway": true, "ipMasq": true,
              "ipam": { "type": "host-local", "ranges": [[{"subnet": "10.88.0.0/16"}]],
                        "routes": [{"dst": "0.0.0.0/0"}] } },
            { "type": "portmap", "capabilities": {"portMappings": true} },
            { "type": "loopback" }
          ]
        }
        EOT

    - name: Build and install urunc
      run: |
        export GOROOT=$(go env GOROOT)
        export PATH="$GOROOT/bin:$PATH"
        make static
        sudo make install
        urunc --version

    - name: Configure urunc
      run: |
        sudo mkdir -p /etc/urunc
        sudo tee /etc/urunc/config.toml > /dev/null <<'EOT'
        [log]
        level = "debug"
        syslog = true
        EOT

    - name: Configure containerd with the urunc runtime handler
      run: |
        sudo mkdir -p /etc/containerd/
        sudo containerd config default | sudo tee /etc/containerd/config.toml > /dev/null
        sudo tee -a /etc/containerd/config.toml > /dev/null <<'EOT'
        [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.urunc]
            runtime_type = "io.containerd.urunc.v2"
            container_annotations = ["com.urunc.unikernel.*"]
            pod_annotations = ["com.urunc.unikernel.*"]
        EOT
        sudo systemctl restart containerd
        sleep 3

    - name: Install critest
      env:
        CRITOOLS_VERSION: ${{ inputs.critools_version || 'v1.36.0' }}
      run: |
        SAFE_CRITOOLS="${CRITOOLS_VERSION}"
        wget -q "https://github.com/kubernetes-sigs/cri-tools/releases/download/${SAFE_CRITOOLS}/critest-${SAFE_CRITOOLS}-linux-${{ matrix.arch }}.tar.gz"
        sudo tar zxf "critest-${SAFE_CRITOOLS}-linux-${{ matrix.arch }}.tar.gz" -C /usr/local/bin
        rm -f "critest-${SAFE_CRITOOLS}-linux-${{ matrix.arch }}.tar.gz"
        critest --version

    - name: Run critest against the urunc handler
      run: |
        # Skips are maintained in tests/critest/skips.txt, one regex per line.
        SKIP_REGEX=$(grep -vE '^\s*(#|$)' tests/critest/skips.txt | paste -sd'|' -)
        echo "Skip regex: ${SKIP_REGEX}"
        SKIP_ARGS=()
        if [ -n "${SKIP_REGEX}" ]; then
          SKIP_ARGS=(--ginkgo.skip="${SKIP_REGEX}")
        fi
        mkdir -p critest-report
        sudo /usr/local/bin/critest \
          --runtime-endpoint unix:///run/containerd/containerd.sock \
          --runtime-handler urunc \
          --ginkgo.focus='\[Conformance\]' \
          "${SKIP_ARGS[@]}" \
          --ginkgo.junit-report "$PWD/critest-report/junit.xml" \
          --ginkgo.timeout 40m

    - name: Upload critest report
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: critest-report-${{ matrix.arch }}-${{ github.run_id }}
        path: critest-report/

    - name: Dump urunc and containerd logs on failure
      if: failure()
      run: |
        echo "=== urunc debug logs ==="
        sudo journalctl --identifier=urunc --no-pager | tail -200 || true
        echo "=== containerd logs ==="
        sudo journalctl -u containerd --no-pager | tail -200 || true
